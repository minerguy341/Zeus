name: Publish to Modrinth

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build & upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from tag
        id: ver
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync gradle.properties version
        run: |
          sed -i "s/^mod.version=.*/mod.version=${{ steps.ver.outputs.version }}/" gradle.properties

      - name: Build (Fabric + NeoForge)
        run: ./gradlew chiseledBuildAndCollect --stacktrace

      - name: Upload to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ vars.MODRINTH_ID }}
          name: ${{ github.event.release.name }}
          version: ${{ steps.ver.outputs.version }}
          changelog: ${{ github.event.release.body }}
          loaders: |-
            fabric
            neoforge
          game-versions: "1.21.1"
          environment: client_only
          dependencies: |-
            [{
              "project_id": "P7dR8mSH",
              "dependency_type": "optional"
            },{
              "project_id": "8K8WPv8S",
              "dependency_type": "optional"
            },{
              "project_id": "b1ZV3DIJ",
              "dependency_type": "optional"
            },{
              "project_id": "BAscRYKm",
              "dependency_type": "optional"
            }]
          files: |-
            build/libs/zeus-fabric-${{ steps.ver.outputs.version }}+mc1.21.1.jar
            build/libs/zeus-neoforge-${{ steps.ver.outputs.version }}+mc1.21.1.jar
